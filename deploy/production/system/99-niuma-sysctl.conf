# niuma 内核参数 —— /etc/sysctl.d/99-niuma.conf（由 install.sh 安装）
#
# 目标不是「吞吐最大」，而是「5Mbps 出口下实时帧不被自己人挤掉」：
# 掉一个玩家的移动帧比多跑几 KB/s 严重得多。
#
# 所有内核参数只放这一个文件。再新建 99-niuma-network.conf 之类的第二个文件，
# 会按文件名字典序互相覆盖（systemd-sysctl 的加载顺序），排错时非常难查。
# /etc/sysctl.conf 里腾讯云镜像预置的冲突键由 install.sh 注释掉。

# ---- 拥塞控制 ----
# 长肥管道（5Mbps / 30ms RTT）上 BBR 比 cubic 更稳，丢包后不会一路砍窗口
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# ---- 连接排队 ----
# nginx 与 Node/Bun 的 accept 队列；511 的默认值在突发首访时会直接丢 SYN
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# ---- 长连接（WebSocket 是本项目的主流量）----
# 空闲一段时间后不要重置拥塞窗口，否则玩家挂机回来发第一帧要重新慢启动
net.ipv4.tcp_slow_start_after_idle = 0
# 允许服务端在 SYN-ACK 里带数据，少一个 RTT
net.ipv4.tcp_fastopen = 3

# ---- 小包与实时性 ----
# 未发送数据低于这个水位就立刻推出去，而不是攒满一个 MSS
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 10000 65000

# ---- TIME_WAIT 与断连回收 ----
# 探活、首访静态资源都是短连接，别让 socket 在 FIN-WAIT-2 上攒着
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# tcp_rmem / tcp_wmem 的第三个数是「自动调优上限」，不是预分配内存：
# 设成 16M 不会爆内存，只在突发时按需增长，3.6G 机器余量足够。
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# ---- 内存 ----
# 3.6G 机器：宁可回收 page cache，也别把 Node 换到 swap 上（换出去就是几百毫秒的长帧）
vm.swappiness = 10
vm.vfs_cache_pressure = 50
fs.file-max = 2097152
